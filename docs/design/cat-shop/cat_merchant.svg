 <path d="M1206,842 q12,-10 6,-24" stroke="#3F8C8F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <text x="1230" y="846">④ 尾巴慢摆 + 头带海星轻晃</text>
</g>
</svg>
