<rect width="1600" height="900" fill="#F5EFE4"/>
<text x="40" y="58" class="t" font-size="30" font-weight="bold">小猫商人 · 形象与表情</text>
<text x="40" y="88" class="t" font-size="16" opacity=".75">三花（参考图5）：左脸灰色斑块盖住眼睛到鼻梁，右额奶橘色，白口鼻，绿眼粉鼻；圆滚滚头身比约 1:1，海带头带 + 小海星 + 贝壳扣围裙</text>

<!-- hero -->
<rect x="40" y="110" width="560" height="620" rx="18" fill="#DCEFEC" stroke="#3a2a22" stroke-width="3"/>
<ellipse cx="320" cy="660" rx="150" ry="20" fill="#3a2a22" opacity=".12"/>
<g transform="translate(320,400) scale(3)"><use href="#catBase"/><use href="#exIdle"/></g>
<text x="60" y="146" class="t" font-size="20" font-weight="bold">待机 Idle（默认）</text>
<g transform="translate(60,690)" class="t" font-size="13">
 <rect x="0" y="0" width="26" height="26" rx="5" fill="#7D8290" stroke="#3a2a22"/><text x="32" y="18">灰</text>
 <rect x="62" y="0" width="26" height="26" rx="5" fill="#F3D3B0" stroke="#3a2a22"/><text x="94" y="18">奶油</text>
 <rect x="136" y="0" width="26" height="26" rx="5" fill="#E9A673" stroke="#3a2a22"/><text x="168" y="18">橘</text>
 <rect x="198" y="0" width="26" height="26" rx="5" fill="#A9BE5E" stroke="#3a2a22"/><text x="230" y="18">眼</text>
 <rect x="260" y="0" width="26" height="26" rx="5" fill="#3F8C8F" stroke="#3a2a22"/><text x="292" y="18">围裙</text>
 <rect x="336" y="0" width="26" height="26" rx="5" fill="#5BA36B" stroke="#3a2a22"/><text x="368" y="18">海带</text>
</g>

<!-- expressions 3x2 -->
<g class="t" font-size="18" font-weight="bold">
 <g transform="translate(630,110)"><rect width="300" height="300" rx="16" fill="#FFF8EE" stroke="#3a2a22" stroke-width="2.5"/><g transform="translate(150,150) scale(1.55)"><use href="#catBase"/><use href="#exHappy"/></g><text x="14" y="30">开心 · 成交</text></g>
 <g transform="translate(950,110)"><rect width="300" height="300" rx="16" fill="#FFF8EE" stroke="#3a2a22" stroke-width="2.5"/><g transform="translate(150,150) scale(1.55)"><use href="#catBase"/><use href="#exSurprised"/></g><text x="14" y="30">惊讶 · 稀有珊瑚</text></g>
 <g transform="translate(1270,110)"><rect width="300" height="300" rx="16" fill="#FFF8EE" stroke="#3a2a22" stroke-width="2.5"/><g transform="translate(150,150) scale(1.55)"><use href="#catBase"/><use href="#exWink"/></g><text x="14" y="30">招呼 · 眨眼挥爪</text></g>
 <g transform="translate(630,430)"><rect width="300" height="300" rx="16" fill="#FFF8EE" stroke="#3a2a22" stroke-width="2.5"/><g transform="translate(150,150) scale(1.55)"><use href="#catBase"/><use href="#exSleepy"/></g><text x="14" y="30">犯困 · 久无人来</text></g>
 <g transform="translate(950,430)"><rect width="300" height="300" rx="16" fill="#FFF8EE" stroke="#3a2a22" stroke-width="2.5"/><g transform="translate(150,150) scale(1.55)"><use href="#catBase"/><use href="#exPout"/></g><text x="14" y="30">嫌弃 · 钱不够</text></g>
 <g transform="translate(1270,430)"><rect width="300" height="300" rx="16" fill="#FFF8EE" stroke="#3a2a22" stroke-width="2.5"/><g transform="translate(150,150) scale(1.55)"><use href="#catBase"/><use href="#exIdle"/></g><text x="14" y="30">待机（对照）</text></g>
</g>

<!-- idle animation notes -->
<text x="40" y="784" class="t" font-size="20" font-weight="bold">Idle 循环（约 4 秒）</text>
<g class="t" font-size="15">
 <g transform="translate(110,840) scale(0.55)"><use href="#catBase"/><use href="#exIdle"/></g>
 <path d="M150,808 v-14 m-5,5 l5,-5 5,5 M150,872 v14 m-5,-5 l5,5 5,-5" stroke="#3F8C8F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <text x="170" y="846">① 呼吸：身体上下 2–3% 挤压</text>
